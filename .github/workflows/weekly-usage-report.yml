# Pulls Friday 5pm Pacific weekly usage from production and stores it as a
# GitHub Actions artifact.
#
# Auth: signs in via POST /login with a usage-admin roster email — no repo
# secrets required (same model as the public web login). Optional overrides:
#   SPK_URL          — defaults to production Railway URL
#   SPK_LOGIN_EMAIL  — defaults to william.a.pratt@usace.army.mil
#   SPK_TOKEN        — if set, used instead of login (e.g. durable APP_API_KEY)
#
# Note: the Railway app also auto-snapshots at Friday 5pm PT on its own.
# This workflow is a backup pull for archive outside Railway.

name: Weekly usage report

on:
  schedule:
    # Friday 5:00 PM PDT = Saturday 00:00 UTC
    - cron: "0 0 * * 6"
    # Friday 5:00 PM PST = Saturday 01:00 UTC
    - cron: "5 1 * * 6"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch weekly report
        env:
          SPK_URL: ${{ secrets.SPK_URL }}
          SPK_TOKEN: ${{ secrets.SPK_TOKEN }}
          SPK_LOGIN_EMAIL: ${{ secrets.SPK_LOGIN_EMAIL }}
        run: |
          set -euo pipefail
          export SPK_URL="${SPK_URL:-https://projectspk-production.up.railway.app}"
          LOGIN_EMAIL="${SPK_LOGIN_EMAIL:-william.a.pratt@usace.army.mil}"

          AUTH_ARGS=()
          if [ -n "${SPK_TOKEN:-}" ]; then
            echo "Using SPK_TOKEN secret"
          else
            echo "Signing in as ${LOGIN_EMAIL}"
            AUTH_ARGS=(--login-email "$LOGIN_EMAIL")
          fi

          mkdir -p reports
          WEEK=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          python3 scripts/weekly_usage_report.py "${AUTH_ARGS[@]}" --save --json --out "reports/weekly-${WEEK}.json"
          python3 scripts/weekly_usage_report.py "${AUTH_ARGS[@]}" --out "reports/weekly-${WEEK}.txt"
          cat "reports/weekly-${WEEK}.txt"
          {
            echo "## Weekly usage report"
            echo ""
            echo '```'
            cat "reports/weekly-${WEEK}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-usage-report
          path: reports/
          retention-days: 365
